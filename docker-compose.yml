

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdg-eventhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: gdg-eventhub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend